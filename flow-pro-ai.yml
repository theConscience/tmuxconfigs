name: flow-pro-ai
root: <%= @settings["root"] || @args[0] || File.expand_path("~/web_dev/repos/projects/ai/2-ai-pro-kit") %>
startup_window: editor
startup_pane: 0
enable_pane_titles: true
pane_title_position: top

# Flow Pro workspace: three independent Git repositories, never submodules.
#
#   .                                      workspace orchestration repository
#   ai-agents-flow-pro-kit/                upstream package repository
#   adoptions/covenant-fighters-adoption/  downstream package repository
#
# Panes that target the adoption tree guard on its presence, because it is
# ignored by the workspace repository and is not guaranteed to be cloned.

windows:
  - editor:
      layout: main-vertical

      focused_pane: editor
      panes:
        - editor: nvim .
        - commands: bash -lc 'just --list; exec "$SHELL"'
        - git: bash -lc 'git status --short --branch; exec "$SHELL"'

  - workflow:
      layout: even-horizontal

      focused_pane: shell1
      panes:
        - shell1: bash -lc 'just where; just versions; exec "$SHELL"'
        - shell2: bash -lc 'just status; exec "$SHELL"'
        - tests: bash -lc 'printf "handoff   just handoff <version> [candidate]\nqualify   just upstream-qualify | just adoption-qualify\nsync      ai-agents-flow-pro-kit/docs/UPSTREAM_DOWNSTREAM_SYNC.md\ncommands  ai-agents-flow-pro-kit/docs/CROSS_REPO_COMMAND_MAP.md\n\nArgument conventions differ between the two repositories.\n"; exec "$SHELL"'

  - upstream:
      root: ai-agents-flow-pro-kit
      layout: main-vertical

      focused_pane: editor
      panes:
        - editor: nvim .
        - commands: bash -lc 'just --list; exec "$SHELL"'
        - git: bash -lc 'git status --short --branch; exec "$SHELL"'

  - adoptions:
      layout: even-horizontal

      focused_pane: editor
      panes:
        - editor: bash -lc 'target=adoptions/covenant-fighters-adoption; if [ -d "$target" ]; then cd "$target"; exec nvim .; else echo "ADOPTION DOWNSTREAM NOT CLONED -> $target"; exec "$SHELL"; fi'
        - commands: bash -lc 'target=adoptions/covenant-fighters-adoption; if [ -d "$target" ]; then cd "$target"; just --list; else echo "ADOPTION DOWNSTREAM NOT CLONED -> $target"; fi; exec "$SHELL"'
        - git: bash -lc 'target=adoptions/covenant-fighters-adoption; if [ -d "$target" ]; then cd "$target"; git status --short --branch; else echo "git@github.com:theConscience/ai-flow-pro-adoption-covenant-fighters.git"; fi; exec "$SHELL"'

  - agents:
      layout: tiled
      focused_pane: opencode
      panes:
        - opencode: bash -lc '{ if command -v opencode >/dev/null 2>&1; then opencode --continue || opencode; else printf "%s\n" "opencode is not installed"; fi; }; exec "$SHELL"'
        - codex: bash -lc '{ if command -v codex >/dev/null 2>&1; then codex resume --last || codex; else printf "%s\n" "codex is not installed"; fi; }; exec "$SHELL"'
        - claude: bash -lc '{ if command -v claude >/dev/null 2>&1; then claude --continue || claude; else printf "%s\n" "claude is not installed"; fi; }; exec "$SHELL"'
        - agy: bash -lc '{ if command -v agy >/dev/null 2>&1; then agy; else printf "%s\n" "agy is not installed"; fi; }; exec "$SHELL"'

  - gates:
      layout: even-horizontal

      focused_pane: shell1
      panes:
        - shell1: bash -lc 'just docs-check; exec "$SHELL"'
        - tests: bash -lc 'just smoke; exec "$SHELL"'
        - shell3: bash -lc 'just env; exec "$SHELL"'

  - packages:
      layout: even-horizontal
      focused_pane: shell1
      panes:
        - shell1: bash -lc 'cd ai-agents-flow-pro-kit && printf "[upstream]\n"; ls -d baselines/*/ work/*/ dist/*/ 2>/dev/null; exec "$SHELL"'
        - shell2: bash -lc 'target=adoptions/covenant-fighters-adoption; if [ -d "$target" ]; then cd "$target"; printf "[adoption]\n"; ls -d baselines/*/ work/*/ dist/*/ 2>/dev/null; else echo "ADOPTION DOWNSTREAM NOT CLONED"; fi; exec "$SHELL"'
        - shell3: bash -lc 'cd ai-agents-flow-pro-kit && printf "[evidence/reviews]\n"; ls evidence/reviews 2>/dev/null; exec "$SHELL"'

  - git:
      layout: even-horizontal
      focused_pane: git
      panes:
        - git: bash -lc 'printf "[workspace] git@github.com:theConscience/ai-flow-pro-workspace.git\n"; git status --short --branch; exec "$SHELL"'
        - shell2: bash -lc 'printf "[upstream] git@github.com:theConscience/ai-flow-pro-kit.git\n"; git -C ai-agents-flow-pro-kit status --short --branch; exec "$SHELL"'
        - shell3: bash -lc 'target=adoptions/covenant-fighters-adoption; printf "[adoption] git@github.com:theConscience/ai-flow-pro-adoption-covenant-fighters.git\n"; if [ -d "$target" ]; then git -C "$target" status --short --branch; else echo "NOT CLONED -> $target"; fi; exec "$SHELL"'
