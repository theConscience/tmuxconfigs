name: vue3
root: <%= @settings["root"] || @args[0] || File.expand_path("~/web_dev/repos/learn/js/vue3") %>

startup_window: editor
startup_pane: 0
enable_pane_titles: true
pane_title_position: top

windows:
  - editor:
      layout: main-vertical
      panes:
        - nvim: nvim .
        - dev: bash -lc 'just dev; exec $SHELL'
        - git: bash -lc 'git status; exec $SHELL'
      focused_pane: nvim

  - ai:
      layout: tiled
      panes:
        - opencode: bash -lc 'opencode; exec $SHELL'
        - codex: bash -lc 'codex; exec $SHELL'
        - claude: bash -lc 'claude; exec $SHELL'
      focused_pane: opencode

  - check:
      layout: even-horizontal
      panes:
        - tests: bash -lc 'just test-watch; exec $SHELL'
        - status: bash -lc 'just status; exec $SHELL'
      focused_pane: tests
