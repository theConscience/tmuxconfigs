name: flow-kits-ai
root: <%= @settings["root"] || [@args[0]].compact.map { |a| File.expand_path(a) }.find { |p| File.directory?(p) } || File.expand_path("~/web_dev/repos/projects/ai") %>
startup_window: overview
startup_pane: 0
enable_pane_titles: true
pane_title_position: top

windows:
  - overview:
      layout: even-horizontal
      focused_pane: git
      panes:
        - git: bash -lc 'cd 1-ai-easy-kit/ai-agent-flow-kit && git status --short --branch; exec "$SHELL"'
        - git2: bash -lc 'cd 2-ai-pro-kit && git status --short --branch; exec "$SHELL"'
        - git3: bash -lc 'cd 2-ai-pro-kit/ai-agents-flow-pro-kit && git status --short --branch; exec "$SHELL"'

  - easy-kit:
      root: 1-ai-easy-kit/ai-agent-flow-kit
      layout: main-vertical

      focused_pane: editor
      panes:
        - editor: nvim .
        - commands: bash -lc 'just --list; exec "$SHELL"'
        - git: bash -lc 'git status --short --branch; exec "$SHELL"'

  - pro-workspace:
      root: 2-ai-pro-kit
      layout: main-vertical

      focused_pane: editor
      panes:
        - editor: nvim .
        - commands: bash -lc 'just --list; exec "$SHELL"'
        - git: bash -lc 'git status --short --branch; exec "$SHELL"'

  - pro-kit:
      root: 2-ai-pro-kit/ai-agents-flow-pro-kit
      layout: main-vertical

      focused_pane: editor
      panes:
        - editor: nvim .
        - commands: bash -lc 'just --list; exec "$SHELL"'
        - git: bash -lc 'git status --short --branch; exec "$SHELL"'

  - ai:
      layout: even-horizontal
      focused_pane: codex
      panes:
        - codex: bash -lc 'cd 1-ai-easy-kit/ai-agent-flow-kit && { if command -v codex >/dev/null 2>&1; then codex resume --last || codex; else printf "%s\n" "codex is not installed"; fi; }; exec "$SHELL"'
        - codex2: bash -lc 'cd 2-ai-pro-kit && { if command -v codex >/dev/null 2>&1; then codex resume --last || codex; else printf "%s\n" "codex is not installed"; fi; }; exec "$SHELL"'
        - codex3: bash -lc 'cd 2-ai-pro-kit/ai-agents-flow-pro-kit && { if command -v codex >/dev/null 2>&1; then codex resume --last || codex; else printf "%s\n" "codex is not installed"; fi; }; exec "$SHELL"'
