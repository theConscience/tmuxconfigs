name: tmux-configs-workbench
root: <%= @settings["root"] || [@args[0]].compact.map { |a| File.expand_path(a) }.find { |p| File.directory?(p) } || File.expand_path("~/web_dev/repos/tmuxconfigs") %>

# A dedicated cockpit for maintaining this repository without mixing it with
# product workspaces. Every long-running command returns to a useful shell.
startup_window: overview
startup_pane: 0
enable_pane_titles: true
pane_title_position: top

windows:
  - overview:
      layout: main-vertical
      focused_pane: editor
      panes:
        - editor: bash -lc 'if command -v nvim >/dev/null 2>&1; then nvim .; else printf "%s\n" "nvim is not installed"; fi; exec "$SHELL"'
        - status: bash -lc 'git status --short --branch; exec "$SHELL"'
        - recent: bash -lc 'git log --oneline --decorate -12; exec "$SHELL"'

  # Агенты работают с самим репозиторием конфигов, как и в продуктовых профилях.
  - ai:
      layout: tiled
      focused_pane: codex
      panes:
        - codex: bash -lc '{ if command -v codex >/dev/null 2>&1; then codex resume --last || codex; else printf "%s\n" "codex is not installed"; fi; }; exec "$SHELL"'
        - claude: bash -lc '{ if command -v claude >/dev/null 2>&1; then claude --continue || claude; else printf "%s\n" "claude is not installed"; fi; }; exec "$SHELL"'
        - opencode: bash -lc '{ if command -v opencode >/dev/null 2>&1; then opencode --continue || opencode; else printf "%s\n" "opencode is not installed"; fi; }; exec "$SHELL"'

  - catalog:
      layout: main-horizontal
      focused_pane: search
      panes:
        - search: >-
            bash -lc 'printf "Tracked workspaces\n------------------\n"; find . -maxdepth 1 -name "*.yml" -print | sort; printf "\nSearch: rg <pattern>\n"; exec "$SHELL"'
        - files: bash -lc 'printf "Tooling\n-------\n"; find bin templates tools -maxdepth 2 -type f -print 2>/dev/null | sort; exec "$SHELL"'

  - verify:
      layout: even-horizontal
      focused_pane: verify
      panes:
        - verify: bash -lc './verify.sh; printf "\nverify exit=%s\n" "$?"; exec "$SHELL"'
        - diff: bash -lc 'git diff --check; git diff --stat; exec "$SHELL"'

  - history:
      layout: main-vertical
      focused_pane: branches
      panes:
        - branches: bash -lc 'git branch -avv; exec "$SHELL"'
        - commits: bash -lc 'git log --graph --decorate --oneline --all -24; exec "$SHELL"'
        - remotes: bash -lc 'git remote -v; exec "$SHELL"'

  - scratch:
      layout: tiled
      focused_pane: shell
      panes:
        - shell: bash -l
        # Рендерим профиль из текущего checkout, а не из установленного симлинка,
        # и показываем настоящий exit code вместо тихого "|| true".
        - render: bash -lc 'TMUXINATOR_CONFIG="$PWD" tmuxinator debug tmux-configs-workbench "$PWD"; printf "\ndebug exit=%s\n" "$?"; exec "$SHELL"'
