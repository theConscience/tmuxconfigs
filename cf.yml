name: cf
root: <%= @settings["root"] || @args[0] || File.expand_path("~/web_dev/repos/projects/covenant-fighters") %>
startup_window: editor
startup_pane: 0
enable_pane_titles: true
pane_title_position: top

windows:
  - editor:
      layout: main-vertical

      # Synchronize all panes of this window, can be enabled before or after the pane commands run.
      # 'before' represents legacy functionality and will be deprecated in a future release, in favour of 'after'
      # synchronize: after
      focused_pane: editor
      panes:
        - editor: nvim .
        - dev: cd covenant-fighters/ && pnpm dev
        - git: cd covenant-fighters/ && git status
  - ai:
      focused_pane: opencode
      panes:
        - opencode: cd covenant-fighters/ && { if command -v opencode >/dev/null 2>&1; then opencode --continue || opencode; else printf "%s\n" "opencode is not installed"; fi; }
      # - codex:
      #     panes:
      #       - cd covenant-fighters/ && codex
  - dev:
      focused_pane: dev
      panes:
        - dev: cd covenant-fighters/ && pnpm run dev-nolog
  - check:
      focused_pane: tests
      panes:
        - tests: cd covenant-fighters/ && pnpm typecheck
  - git:
      focused_pane: git
      panes:
        - git: cd covenant-fighters/ && git status
